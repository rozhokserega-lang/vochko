name: Telegram setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set menu button and description
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WEBAPP_URL: ${{ vars.WEBAPP_URL || 'https://rozhokserega-lang.github.io/vochko/' }}
        run: node telegram/setup.mjs
